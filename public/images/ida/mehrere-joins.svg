<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="340" viewBox="0 0 1140 340" role="img" aria-label="Zwei unabhängige Detailzweige"><rect width="1140" height="340" rx="18" fill="#f5f8fc"/><g font-family="Arial,sans-serif" fill="#162e48"><text x="30" y="36" font-size="14" fill="#526b83">SCHEMATISCHE DARSTELLUNG · SYNTHETISCHE DATEN</text><text x="30" y="75" font-size="26" font-weight="700">Zwei unabhängige Detailzweige</text><rect x="30" y="105" width="340" height="146" rx="12" fill="white" stroke="#c5d4e4"/><text x="48" y="138" font-size="18" font-weight="700">Konten</text><text x="48" y="183" font-size="17">P001 · K001</text><text x="48" y="218" font-size="16" fill="#486078">P001 · K002</text><rect x="400" y="105" width="340" height="146" rx="12" fill="white" stroke="#c5d4e4"/><text x="418" y="138" font-size="18" font-weight="700">Vorgänge</text><text x="418" y="183" font-size="17">P001 · V001 / V002 / V003</text><text x="418" y="218" font-size="16" fill="#486078">3 Vorgänge</text><rect x="770" y="105" width="340" height="146" rx="12" fill="white" stroke="#c5d4e4"/><text x="788" y="138" font-size="18" font-weight="700">Gemeinsamer Detailjoin</text><text x="788" y="183" font-size="17">2 × 3 = 6 Zeilen</text><text x="788" y="218" font-size="16" fill="#486078">Beträge werden wiederholt</text><text x="30" y="300" font-size="17">Vor dem Verbinden beide Detailzweige auf die Zielgranularität bringen.</text></g></svg>