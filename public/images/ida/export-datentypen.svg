<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="340" viewBox="0 0 1140 340" role="img" aria-label="Kennungen beim Export als Text erhalten"><rect width="1140" height="340" rx="18" fill="#f5f8fc"/><g font-family="Arial,sans-serif" fill="#162e48"><text x="30" y="36" font-size="14" fill="#526b83">SCHEMATISCHE DARSTELLUNG · SYNTHETISCHE DATEN</text><text x="30" y="75" font-size="26" font-weight="700">Kennungen beim Export als Text erhalten</text><rect x="30" y="105" width="340" height="146" rx="12" fill="white" stroke="#c5d4e4"/><text x="48" y="138" font-size="18" font-weight="700">Berichtsliste</text><text x="48" y="183" font-size="17">Kennung: 00042</text><text x="48" y="218" font-size="16" fill="#486078">Betrag: 1.250,00</text><rect x="400" y="105" width="340" height="146" rx="12" fill="white" stroke="#c5d4e4"/><text x="418" y="138" font-size="18" font-weight="700">Import bewusst festlegen</text><text x="418" y="183" font-size="17">Kennung → Text</text><text x="418" y="218" font-size="16" fill="#486078">Betrag → Zahl, Gebietsschema</text><rect x="770" y="105" width="340" height="146" rx="12" fill="white" stroke="#c5d4e4"/><text x="788" y="138" font-size="18" font-weight="700">Weiterverarbeitung</text><text x="788" y="183" font-size="17">00042 bleibt 00042</text><text x="788" y="218" font-size="16" fill="#486078">Betrag ist berechenbar</text><text x="30" y="300" font-size="17">Ein Zahlenformat allein stellt verlorene führende Nullen nicht wieder her.</text></g></svg>