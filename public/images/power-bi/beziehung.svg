<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-labelledby="title desc"><title id="title">Eine Produktzeile filtert zwei Bestandszeilen</title><desc id="desc">Demo_Produkt enthält PR-A einmal. Die 1:n-Beziehung führt zu zwei Konten in Demo_Bestand. Alle Werte sind synthetisch.</desc><rect width="1000" height="290" fill="#f5f8fc"/><g font-family="Arial,sans-serif" fill="#183b5c"><text x="35" y="35" font-size="16">1:n-Beziehung · selbst erstelltes Schema, keine Programmoberfläche</text><rect x="35" y="65" width="310" height="135" rx="8" fill="white" stroke="#b9cfe3"/><text x="55" y="98" font-size="20" font-weight="bold">Demo_Produkt</text><path d="M35 115h310" stroke="#d3e1ed"/><text x="55" y="151" font-size="18">PR-A</text><text x="170" y="151" font-size="18">Gruppe A</text><rect x="595" y="65" width="370" height="170" rx="8" fill="white" stroke="#b9cfe3"/><text x="615" y="98" font-size="20" font-weight="bold">Demo_Bestand</text><path d="M595 115h370" stroke="#d3e1ed"/><text x="615" y="151" font-size="18">K-A</text><text x="730" y="151" font-size="18">PR-A</text><text x="835" y="151" font-size="18">120 €</text><text x="615" y="194" font-size="18">K-B</text><text x="730" y="194" font-size="18">PR-A</text><text x="835" y="194" font-size="18">80 €</text><path d="M355 140h225m-10-7 10 7-10 7" fill="none" stroke="#3274b0" stroke-width="3"/><text x="365" y="125" font-size="21">1</text><text x="556" y="125" font-size="21">n</text><text x="399" y="171" font-size="15">Filterrichtung</text><text x="35" y="268" font-size="16">Eine eindeutige Produkt-ID → mehrere passende Konten am selben Stichtag.</text></g></svg>
